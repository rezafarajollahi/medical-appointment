{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-body">
        <h1 class="h4 mb-3">{{ title }}</h1>

        {% if description %}
          <p class="alert alert-info">{{ description }}</p>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}
          {% include "includes/form_fields.html" %}
          <button class="btn btn-primary">{{ submit_label|default:"ثبت" }}</button>
          <a class="btn btn-outline-secondary" href="javascript:history.back()">بازگشت</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
