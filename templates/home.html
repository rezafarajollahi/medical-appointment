{% extends "base.html" %}

{% block content %}
<div class="card mb-4">
  <div class="card-body">
    <h1 class="h3">دریافت نوبت از پزشکان و متخصصان</h1>
    <p class="text-muted">پزشک موردنظر را بر اساس نام یا تخصص پیدا کنید.</p>

    <form method="get" action="{% url 'doctors:list' %}" class="row g-2">
      <div class="col-md-6">{{ form.q }}</div>
      <div class="col-md-4">{{ form.specialty }}</div>
      <div class="col-md-2">
        <button class="btn btn-primary w-100">جستجو</button>
      </div>
    </form>
  </div>
</div>

<h2 class="h5">تخصص‌ها</h2>
<div class="d-flex flex-wrap gap-2">
  {% for specialty in specialties %}
    <a class="btn btn-outline-primary"
       href="{% url 'doctors:list' %}?specialty={{ specialty.pk }}">
      {{ specialty.name }}
    </a>
  {% empty %}
    <p class="text-muted">هنوز تخصصی ثبت نشده است.</p>
  {% endfor %}
</div>
{% endblock %}
